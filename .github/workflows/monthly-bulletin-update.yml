name: Monthly Visa Bulletin Update

on:
  workflow_dispatch:
  schedule:
    # DOS usually publishes the next bulletin in the first half of the month.
    # Run after the common release window and let the script discover the newest page.
    - cron: '30 14 12 * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  update-bulletin:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Discover and apply latest bulletin
        run: pnpm update:bulletin

      - name: Verify tracker data
        run: pnpm check && pnpm test

      - name: Build
        run: pnpm build

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Update visa bulletin data
          branch: automation/monthly-visa-bulletin
          delete-branch: true
          title: Update visa bulletin data
          body: |
            Automated monthly Visa Bulletin refresh.

            This PR was generated by `scripts/update-bulletin.mjs`, then verified with:
            - `pnpm check`
            - `pnpm test`
            - `pnpm build`
